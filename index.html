<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siraj Qureshi | Portfolio</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .portfolio-frame {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }

    .quick-links {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: flex-end;
    }

    .quick-link {
      display: block;
      color: #ffffff;
      padding: 18px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      transition: all 0.2s ease;
      text-align: center;
    }

    .quick-link:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .quick-link:focus {
      outline: 3px solid rgba(255, 255, 255, 0.7);
      outline-offset: 3px;
    }

    /* Blue */
    .icpc {
      background: #0066cc;
    }

    /* Green */
    .password-reset {
      background: #28a745;
    }

    /* Orange */
    .complaint-portal {
      background: #e67e22;
    }

    /* Dark Blue */
    .submit-complaint {
      background: #004b7a;
      border: 2px solid #004b7a;
    }

    .submit-complaint:hover {
      background: #6faf3d;
      border-color: #6faf3d;
    }

    @media (max-width: 700px) {
      .quick-links {
        top: 10px;
        right: 10px;
        gap: 8px;
      }

      .quick-link {
        padding: 11px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- Portfolio -->
  <iframe
    class="portfolio-frame"
    src="https://bespoke-folio-flair-73580.lovable.app"
    title="Siraj Qureshi Portfolio">
  </iframe>

  <!-- Quick Links -->
  <div class="quick-links">

    <!-- ICPC Account Request -->
    <a
      href="/icpc-request.html"
      class="quick-link icpc">
      📋 ICPC Account Request
    </a>

    <!-- Password Reset -->
    <a
      href="/reset-password.html"
      class="quick-link password-reset">
      🔐 MUET Password Reset
    </a>

   

    <!-- Submit IT Complaint -->
    <a
      href="https://script.google.com/macros/s/AKfycbxmKzkVqtiz2XJqdibAEFh26lofK6_CmbllbbhMrKU80SkvZ4Hzp90VnPauq7uqoLgQRA/exec"
      target="_blank"
      rel="noopener noreferrer"
      class="quick-link submit-complaint">
      📝 MUET Complaint Portal
    </a>

  </div>

</body>
</html>
